workflows:
  android-debug:
    name: Attendance Tracker Final APK
    max_build_duration: 60
    environment:
      java: 17

    scripts:
      - name: Extract Attendance Tracker project
        script: |
          rm -rf _attendance_build
          mkdir -p _attendance_build
          unzip -q AttendanceTrackerAndroid_FINAL_Working.zip -d _attendance_build

      - name: Build Android APK
        script: |
          cd _attendance_build/AttendanceTrackerAndroid
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - _attendance_build/AttendanceTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
